services:
  - type: web
    name: second-draft
    runtime: python
    plan: starter          # free tier works too, but sleeps after 15 min idle
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: BACKEND
        value: hosted      # models run on Replicate's GPUs, not ours
      - key: PYTHON_VERSION
        value: "3.11"
      - key: OPENAI_API_KEY
        sync: false        # you paste this in Render, it is never in the repo
      - key: REPLICATE_API_TOKEN
        sync: false
