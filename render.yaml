services:
  - type: web
    name: second-draft
    runtime: python
    plan: starter          # free tier works too, but sleeps after 15 min idle
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Which engine runs is worked out from whichever keys are present, so
      # there is no BACKEND to set and get wrong. Fill in ONE of these groups.
      #
      # Free, no card — aistudio.google.com/apikey
      - key: GOOGLE_API_KEY
        sync: false        # you paste this in Render, it is never in the repo
      # Paid, and the only path where doors are masked rather than asked about
      - key: OPENAI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      # Accounts and saved designs. Without this the app falls back to a file
      # on disk, and a free web service wipes its disk on every deploy — so
      # everyone's designs would vanish at the next push.
      - key: DATABASE_URL
        fromDatabase:
          name: second-draft-db
          property: connectionString
      # Continue with Google. Made at console.cloud.google.com; leave both
      # blank and the button simply does not appear.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional: closes the whole studio to anyone without this phrase. It is
      # not the login — it gates the deployment, accounts identify people.
      - key: STUDIO_ACCESS_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true    # so nobody is signed out by a restart

databases:
  - name: second-draft-db
    plan: free             # free Postgres expires after 90 days; upgrade before then
