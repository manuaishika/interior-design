<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Interior Design</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --ink: #1d1d1f; --muted: #6b6b70;
    --line: #e3e3df; --accent: #2f6f4e; --locked: #b4442e; --unlocked: #2f6f4e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2rem 1.25rem 4rem; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 2rem; }
  .step { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 1.25rem 1.4rem; margin-bottom: 1.1rem; }
  .step h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 0 0 .9rem; font-weight: 600; }
  input[type=file], input[type=text] { width: 100%; padding: .6rem; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; font: inherit; }
  .styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .6rem; }
  .style { border: 1px solid var(--line); border-radius: 9px; padding: .7rem .85rem; cursor: pointer;
    background: #fff; text-align: left; font: inherit; transition: .12s; }
  .style:hover { border-color: #c3c3bd; }
  .style[aria-pressed=true] { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(47,111,78,.14); }
  .style b { display: block; margin-bottom: .2rem; }
  .style span { color: var(--muted); font-size: .8rem; }
  .actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
  button.go { background: var(--accent); color: #fff; border: 0; border-radius: 9px;
    padding: .7rem 1.3rem; font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line);
    border-radius: 9px; padding: .7rem 1.1rem; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
  figure { margin: 0; }
  figure img { width: 100%; border-radius: 9px; border: 1px solid var(--line); display: block;
    background: #fff; }
  figcaption { color: var(--muted); font-size: .78rem; margin-top: .4rem; }
  table { width: 100%; border-collapse: collapse; font-size: .86rem; }
  th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: .76rem; text-transform: uppercase;
    letter-spacing: .05em; }
  .pill { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .74rem;
    font-weight: 600; }
  .pill.locked { background: rgba(180,68,46,.12); color: var(--locked); }
  .pill.unlocked { background: rgba(47,111,78,.12); color: var(--unlocked); }
  pre { background: #16161a; color: #e6e6e6; padding: 1rem; border-radius: 9px; overflow: auto;
    max-height: 22rem; font-size: .78rem; }
  .status { margin-top: .8rem; color: var(--muted); font-size: .88rem; }
  .status.err { color: var(--locked); }
  .hidden { display: none; }
  details summary { cursor: pointer; color: var(--muted); font-size: .84rem; }
</style>
</head>
<body>
<main>
  <h1>AI Interior Design</h1>
  <p class="sub">Upload a room photo, pick a style, and generate — doors, windows and walkways stay put.</p>

  <section class="step">
    <h2>Step 1 · Upload a room photo</h2>
    <input type="file" id="photo" accept="image/*" />
    <div id="previewWrap" class="hidden" style="margin-top:1rem;max-width:380px">
      <figure><img id="preview" alt="Uploaded room" /></figure>
    </div>
  </section>

  <section class="step">
    <h2>Step 2 · Choose a style</h2>
    <div class="styles" id="styles"></div>
    <div style="margin-top:.9rem">
      <input type="text" id="extra" placeholder="Optional extra direction — e.g. “add a reading nook by the window”" />
    </div>
  </section>

  <section class="step">
    <h2>Step 3 · Analyze &amp; generate</h2>
    <div class="actions">
      <button class="go" id="generate" disabled>Analyze &amp; generate</button>
      <button class="ghost" id="analyze" disabled>Analyze only</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="step hidden" id="results">
    <h2>Result</h2>
    <div class="grid" id="images"></div>
  </section>

  <section class="step hidden" id="detected">
    <h2>Detected regions</h2>
    <table>
      <thead>
        <tr><th>Label</th><th>Category</th><th>Mask</th><th>Bounding box</th><th>Conf.</th><th>State</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="status" id="counts"></p>
    <details style="margin-top:1rem">
      <summary>Raw JSON</summary>
      <pre id="json"></pre>
    </details>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let selectedStyle = null;

function refreshButtons() {
  const ready = Boolean($('photo').files[0]);
  $('analyze').disabled = !ready;
  $('generate').disabled = !ready || !selectedStyle;
}

$('photo').addEventListener('change', () => {
  const file = $('photo').files[0];
  if (file) {
    $('preview').src = URL.createObjectURL(file);
    $('previewWrap').classList.remove('hidden');
  }
  refreshButtons();
});

fetch('/api/styles').then(r => r.json()).then(({ styles }) => {
  $('styles').innerHTML = '';
  styles.forEach(({ id, description }) => {
    const b = document.createElement('button');
    b.className = 'style';
    b.type = 'button';
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `<b>${id.replace(/-/g, ' ')}</b><span>${description}</span>`;
    b.onclick = () => {
      selectedStyle = id;
      [...$('styles').children].forEach(c => c.setAttribute('aria-pressed', String(c === b)));
      refreshButtons();
    };
    $('styles').append(b);
  });
}).catch(() => { $('status').textContent = 'Could not load styles.'; });

function setStatus(message, isError = false) {
  $('status').textContent = message;
  $('status').classList.toggle('err', isError);
}

function renderAnalysis(analysis) {
  $('rows').innerHTML = '';
  analysis.objects.forEach(o => {
    const bb = o.bounding_box;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${o.label}</strong></td>
      <td>${o.category}</td>
      <td><code>${o.mask_id}</code></td>
      <td>${bb.x}, ${bb.y} · ${bb.width}×${bb.height}</td>
      <td>${o.confidence.toFixed(2)}</td>
      <td><span class="pill ${o.locked ? 'locked' : 'unlocked'}">${o.locked ? 'locked' : 'editable'}</span></td>`;
    $('rows').append(tr);
  });
  const locked = analysis.objects.filter(o => o.locked).length;
  $('counts').textContent =
    `${analysis.objects.length} regions labeled (${locked} locked, ` +
    `${analysis.objects.length - locked} editable) from ${analysis.masks_returned} SAM2 masks.`;
  $('json').textContent = JSON.stringify(analysis, null, 2);
  $('detected').classList.remove('hidden');
}

function renderImages(generation) {
  const original = $('photo').files[0] ? URL.createObjectURL($('photo').files[0]) : '';
  $('images').innerHTML = `
    <figure><img src="${original}" alt="Original room"><figcaption>Original</figcaption></figure>
    <figure><img src="data:image/png;base64,${generation.image_base64}" alt="Generated room">
      <figcaption>Generated</figcaption></figure>
    <figure><img src="data:image/png;base64,${generation.inpaint_mask_base64}" alt="Inpainting mask">
      <figcaption>Inpainting mask — white was regenerated, black was preserved</figcaption></figure>`;
  $('results').classList.remove('hidden');
}

async function post(url, form, pending) {
  setStatus(pending);
  $('generate').disabled = $('analyze').disabled = true;
  try {
    const res = await fetch(url, { method: 'POST', body: form });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || `Request failed (${res.status})`);
    return body;
  } finally {
    refreshButtons();
  }
}

$('analyze').onclick = async () => {
  const form = new FormData();
  form.append('photo', $('photo').files[0]);
  try {
    const { analysis } = await post('/api/analyze', form, 'Segmenting and labeling the room…');
    renderAnalysis(analysis);
    setStatus(`Analysis complete — ${analysis.objects.length} regions.`);
  } catch (e) { setStatus(e.message, true); }
};

$('generate').onclick = async () => {
  const form = new FormData();
  form.append('photo', $('photo').files[0]);
  form.append('style', selectedStyle);
  form.append('extra_prompt', $('extra').value);
  try {
    const { analysis, generation } = await post(
      '/api/generate', form, 'Segmenting, labeling, then generating — this takes a minute…');
    renderAnalysis(analysis);
    renderImages(generation);
    setStatus('Done.');
  } catch (e) { setStatus(e.message, true); }
};
</script>
</body>
</html>
